<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sector — Directors Dealings</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<style>
  html, body { background:#f8fafc; color:#0f172a; }
  .tf-btn[aria-pressed="false"] { opacity:.35; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

<!-- ===== GLOBAL NAV ===== -->
<header class="border-b border-slate-200 bg-white px-4 sm:px-6 h-12 flex items-center justify-between gap-2 sticky top-0 z-30">
  <h1 class="text-sm font-semibold text-slate-900 tracking-tight truncate">Directors Dealings</h1>
  <nav class="flex items-center gap-3 text-xs text-slate-500">
    <a class="hover:text-slate-900" href="./index.html">Today</a>
    <a class="hover:text-slate-900" href="./performance.html">Performance</a>
    <a class="hover:text-slate-900" href="./baskets.html">Baskets</a>
    <a id="reviewNavLink" class="hover:text-slate-900" href="review.html">Review ✎</a>
  </nav>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 pb-20">
  <div class="pt-3">
    <a href="./index.html" class="text-xs text-slate-500 hover:text-slate-900">&larr; Back to Today</a>
  </div>
  <div id="app"><div class="py-20 text-center text-slate-400 text-sm">Loading sector…</div></div>
  <footer class="mt-10 pt-4 border-t border-slate-200 text-[11px] text-slate-400">
    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 align-middle mr-1"></span>
    Live from the Directors Dealings database. UK RNS PDMR announcements, grouped by GICS-style sector.
  </footer>
</main>

<script>
// Public, read-only credentials (RLS restricts the anon key to the serving views).
const SUPABASE_URL = "https://mmiaiauybzsdcbrrcxfc.supabase.co";
const SUPABASE_KEY = "sb_publishable_vADFSIyRre-9sGyhDnXBcA_H167SU8B";
const isLocalhost = location.hostname === "localhost" || location.hostname === "127.0.0.1";
if (!isLocalhost) { const rl = document.getElementById("reviewNavLink"); if (rl) rl.style.display = "none"; }

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const sector = (params.get("sector") || "").trim();
const daysParam = params.get("days") || "";

const fmtInt = n => (n == null ? "" : Number(n).toLocaleString("en-GB"));
const fmtGbp = n => (n == null || n === "" ? "-" : "£" + Number(n).toLocaleString("en-GB", { maximumFractionDigits: 0 }));
const esc = s => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])));
const day = s => (s ? String(s).slice(0, 10) : "");
const companyUrl = t => "company.html?ticker=" + encodeURIComponent(t || "");

// ---- Signal tier palette (mirror of index.html / company.html) -------------
const TIER = {
  t0:"bg-red-600 text-white", t1a:"bg-red-500 text-white", t1b:"bg-rose-500 text-white",
  t7:"bg-violet-500 text-white", t2:"bg-amber-500 text-white", t3:"bg-emerald-500 text-white",
  t5:"bg-orange-400 text-white", t6:"bg-slate-300 text-white", t4:"bg-slate-400 text-white",
  s1:"bg-blue-500 text-white", f1:"bg-purple-500 text-white", b1:"bg-cyan-500 text-white", b2:"bg-red-600 text-white"
};
const SIG_L2S = {
  t0_cluster_combo:"t0", t1a_ceo_founder_buy:"t1a", t1b_cfo_buy:"t1b", t7_chair_buy:"t7",
  t2_exec_buy:"t2", t3_ned_buy:"t3", t5_pca_buy:"t5", t6_company_sec_buy:"t6", t4_other_buy:"t4",
  s1_cluster_buy:"s1", f1_first_time_buy:"f1", b1_lone_conviction_buy:"b1", b2_crowded_cluster_kill:"b2"
};
const SIG_SEV = { t0:0,t1a:1,t1b:2,t7:3,t2:4,t3:5,t5:6,t6:7,t4:8,s1:9,f1:10,b1:11,b2:12 };
const SIG_TIP = {
  t0:"T0 — Cluster + opportunistic combo. Highest conviction.",
  t1a:"T1a — CEO / Founder buy ≥ £100k.", t1b:"T1b — CFO buy ≥ £100k.",
  t7:"T7 — Chair buy ≥ £25k.", t2:"T2 — Other senior exec buy ≥ £25k.",
  t3:"T3 — NED buy ≥ £10k.", t5:"T5 — PCA buy ≥ £10k.", t6:"T6 — Co Sec / GC buy ≥ £10k.",
  t4:"T4 — Other discretionary buy ≥ £1k.", s1:"S1 — Cluster (≥2 directors, 30d).",
  f1:"F1 — First-time buy of this ticker.", b1:"B1 — Lone conviction buy ≥ £200k.",
  b2:"B2 — Crowded cluster kill (≥4 directors)."
};
function sigBadges(sigs) {
  if (!sigs || !sigs.length) return '<span class="text-slate-300">-</span>';
  const short = sigs.map(s => SIG_L2S[s] || s).filter(Boolean).sort((a, b) => (SIG_SEV[a] ?? 99) - (SIG_SEV[b] ?? 99));
  return '<span class="inline-flex flex-wrap gap-1">' + short.map(s => {
    const cls = TIER[s] || "bg-slate-300 text-white";
    return `<span title="${esc(SIG_TIP[s] || s)}" class="cursor-help inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold ${cls}">${esc(s.toUpperCase())}</span>`;
  }).join("") + '</span>';
}

// ---- Role chips (mirror of index.html / company.html) ----------------------
const ROLE_CLS = {
  "CEO":"bg-indigo-100 text-indigo-700", "CFO":"bg-indigo-100 text-indigo-700", "Other Chief":"bg-indigo-50 text-indigo-600",
  "Founder":"bg-emerald-100 text-emerald-700", "Chair (executive)":"bg-violet-100 text-violet-700", "Non-Exec Chair":"bg-violet-50 text-violet-600",
  "NED":"bg-slate-100 text-slate-600", "Executive Director":"bg-sky-100 text-sky-700", "Divisional / Regional Exec":"bg-sky-50 text-sky-600",
  "President / VP":"bg-sky-50 text-sky-600", "Company Secretary / General Counsel":"bg-slate-50 text-slate-500", "PCA":"bg-amber-50 text-amber-700",
  "PDMR-only":"bg-slate-50 text-slate-500", "Other / unclassified":"bg-slate-50 text-slate-400", "Parser fragment":"bg-rose-50 text-rose-500"
};
const ROLE_LABEL = {
  "CEO":"CEO", "CFO":"CFO", "Other Chief":"C-suite", "Founder":"Founder", "Chair (executive)":"Chair", "Non-Exec Chair":"NE Chair",
  "NED":"NED", "Executive Director":"Exec Dir", "Divisional / Regional Exec":"Div Exec", "President / VP":"VP",
  "Company Secretary / General Counsel":"Co Sec", "PCA":"PCA", "PDMR-only":"PDMR", "Other / unclassified":"Other", "Parser fragment":"?"
};
function roleChip(role, rn) {
  if (!role && !rn) return '<span class="text-slate-300">-</span>';
  if (!rn) return `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${esc(role)}</span>`;
  const cls = ROLE_CLS[rn] || "bg-slate-100 text-slate-600";
  const short = ROLE_LABEL[rn] || rn;
  return `<span class="text-[10px] px-1.5 py-0.5 rounded ${cls}" title="${esc(role || rn)}">${esc(short)}</span>`;
}

async function fetchView(view, qs) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${view}?${qs}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error(view + " HTTP " + res.status);
  return res.json();
}

function statTile(label, value, note) {
  return `<div class="bg-white border border-slate-200 rounded-lg px-3 py-2.5">
    <div class="text-[10px] uppercase tracking-wide text-slate-400">${label}</div>
    <div class="text-xl font-semibold text-slate-800 mt-0.5">${value}</div>
    ${note ? `<div class="text-[10px] text-slate-400 mt-0.5">${note}</div>` : ""}
  </div>`;
}

function periodDropdown() {
  const periods = [["", "All Time"], ["30", "Last 30 Days"], ["90", "Last 90 Days"], ["180", "Last 180 Days"], ["365", "Last 365 Days"]];
  const options = periods.map(([v, l]) => `<option value="${v}"${v === daysParam ? " selected" : ""}>${esc(l)}</option>`).join("");
  return `<select id="periodSelect" class="text-xs border border-slate-200 rounded px-2 py-1 text-slate-600 bg-white focus:outline-none focus:ring-1 focus:ring-indigo-400 cursor-pointer">${options}</select>`;
}

function summaryTiles(rows) {
  const tot = { companies: new Set(), directors: new Set(), buys: 0, sells: 0, buyVal: 0, sellVal: 0 };
  rows.forEach(r => {
    tot.companies.add(r.ticker);
    const d = (r.director || "").trim().toLowerCase();
    if (d) tot.directors.add(d);
    const t = (r.type || "").toUpperCase();
    if (t === "BUY") { tot.buys++; tot.buyVal += Number(r.value) || 0; }
    else if (t === "SELL") { tot.sells++; tot.sellVal += Number(r.value) || 0; }
  });
  const netVol = tot.buys - tot.sells;
  const netVal = tot.buyVal - tot.sellVal;
  return `<div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">`
    + statTile("Companies", fmtInt(tot.companies.size), "distinct tickers")
    + statTile("Directors", fmtInt(tot.directors.size), "unique names")
    + statTile("Buys", fmtInt(tot.buys), fmtGbp(tot.buyVal))
    + statTile("Sells", fmtInt(tot.sells), fmtGbp(tot.sellVal))
    + statTile("Net volume", (netVol >= 0 ? "+" : "") + fmtInt(netVol), "buys minus sells")
    + statTile("Net value", (netVal >= 0 ? "+" : "-") + fmtGbp(Math.abs(netVal)), "buy £ minus sell £")
    + `</div>`;
}

function companiesTable(rows) {
  const byTicker = {};
  rows.forEach(r => {
    const k = r.ticker || "?";
    if (!byTicker[k]) byTicker[k] = { ticker: k, company: r.company || k, buys: 0, sells: 0, buyVal: 0, sellVal: 0 };
    const e = byTicker[k];
    if (r.company && r.company.length > e.company.length) e.company = r.company;
    const t = (r.type || "").toUpperCase();
    if (t === "BUY") { e.buys++; e.buyVal += Number(r.value) || 0; }
    else if (t === "SELL") { e.sells++; e.sellVal += Number(r.value) || 0; }
  });
  const list = Object.values(byTicker).sort((a, b) => (b.buys + b.sells) - (a.buys + a.sells));
  const body = list.map(e => {
    const netVal = e.buyVal - e.sellVal;
    const netCls = netVal >= 0 ? "text-emerald-700" : "text-red-600";
    return `<tr class="border-t border-slate-100 hover:bg-slate-50">
      <td class="py-1.5 px-2 text-xs"><a class="text-indigo-600 hover:underline font-medium" href="${companyUrl(e.ticker)}">${esc(e.ticker)}</a></td>
      <td class="py-1.5 px-2 text-xs text-slate-700">${esc(e.company)}</td>
      <td class="py-1.5 px-2 text-xs text-right tabular-nums text-emerald-700">${fmtInt(e.buys)}</td>
      <td class="py-1.5 px-2 text-xs text-right tabular-nums text-red-600">${fmtInt(e.sells)}</td>
      <td class="py-1.5 px-2 text-xs text-right tabular-nums text-emerald-700">${fmtGbp(e.buyVal)}</td>
      <td class="py-1.5 px-2 text-xs text-right tabular-nums text-red-600">${fmtGbp(e.sellVal)}</td>
      <td class="py-1.5 px-2 text-xs text-right tabular-nums font-semibold ${netCls}">${netVal >= 0 ? "+" : "-"}${fmtGbp(Math.abs(netVal))}</td>
    </tr>`;
  }).join("");
  return `
    <section class="mt-4 bg-white border border-slate-200 rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100">
        <h2 class="text-xs uppercase tracking-wide text-slate-400">Companies in this sector (${fmtInt(list.length)})</h2>
      </div>
      <div class="overflow-x-auto"><table class="w-full">
        <thead><tr class="text-left text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-100">
          <th class="py-1.5 px-2 font-medium">Ticker</th>
          <th class="py-1.5 px-2 font-medium">Company</th>
          <th class="py-1.5 px-2 font-medium text-right text-emerald-700">Buys</th>
          <th class="py-1.5 px-2 font-medium text-right text-red-600">Sells</th>
          <th class="py-1.5 px-2 font-medium text-right text-emerald-700">Buy £</th>
          <th class="py-1.5 px-2 font-medium text-right text-red-600">Sell £</th>
          <th class="py-1.5 px-2 font-medium text-right text-slate-500">Net £</th>
        </tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
}

function dealingsTable(rows) {
  const body = rows.map(r => {
    const type = (r.type || "").toUpperCase();
    const tkey = type || "OTHER";
    const search = `${r.ticker || ""} ${r.company || ""} ${r.director || ""}`.toLowerCase();
    const tcls = type === "BUY" ? "bg-emerald-100 text-emerald-700"
      : (type === "SELL" || type === "SELL_TAX") ? "bg-rose-100 text-rose-700"
      : "bg-slate-100 text-slate-500";
    const url = r.url || "";
    const src = url
      ? `<a href="${esc(url)}" target="_blank" rel="noopener" class="text-slate-400 hover:text-indigo-600" title="Open RNS announcement">↗</a>`
      : `<span class="text-slate-200" title="no RNS link on file">↗</span>`;
    return `<tr data-type="${esc(tkey)}" data-search="${esc(search)}" class="border-b border-slate-100 hover:bg-slate-50">
      <td class="px-3 py-2 text-slate-600">${esc(day(r.date))}</td>
      <td class="px-3 py-2"><a class="text-indigo-600 hover:underline font-medium" href="${companyUrl(r.ticker)}">${esc(r.ticker)}</a> <span class="text-slate-400">${esc(r.company || "")}</span></td>
      <td class="px-3 py-2 text-slate-700">${esc(r.director || "-")}</td>
      <td class="px-3 py-2">${roleChip(r.role, r.role_normalized)}</td>
      <td class="px-3 py-2"><span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${tcls}">${esc(type || "-")}</span></td>
      <td class="px-3 py-2 text-right tabular-nums">${fmtInt(r.shares)}</td>
      <td class="px-3 py-2 text-right tabular-nums">${Number(r.price) ? Number(r.price).toFixed(2) : "-"}</td>
      <td class="px-3 py-2 text-right tabular-nums">${fmtGbp(r.value)}</td>
      <td class="px-3 py-2">${sigBadges(r.signals)}</td>
      <td class="px-3 py-2 text-center">${src}</td>
    </tr>`;
  }).join("");
  const types = [...new Set(rows.map(r => ((r.type || "").toUpperCase()) || "OTHER"))];
  const TYPE_CLS = { BUY: "bg-emerald-600 border-emerald-600", SELL: "bg-rose-600 border-rose-600", SELL_TAX: "bg-rose-600 border-rose-600" };
  const orderT = ["BUY", "SELL", "SELL_TAX"];
  const sortedTypes = [...orderT.filter(t => types.includes(t)), ...types.filter(t => !orderT.includes(t)).sort()];
  const chips = sortedTypes.map(t =>
    `<button type="button" data-tf="${esc(t)}" aria-pressed="${t === 'BUY' || t === 'SELL' ? 'true' : 'false'}" class="tf-btn px-2 py-0.5 rounded text-[11px] font-semibold text-white border ${TYPE_CLS[t] || "bg-slate-600 border-slate-600"}">${esc(t)}</button>`
  ).join("");
  return `
    <section class="mt-4 bg-white border border-slate-200 rounded-lg overflow-hidden">
      <div class="flex items-center justify-between gap-2 flex-wrap px-4 py-3 border-b border-slate-200">
        <h2 class="text-xs uppercase tracking-wide text-slate-500">All dealings (${fmtInt(rows.length)})</h2>
        <div class="flex items-center gap-3 flex-wrap">
          <input id="sectorSearch" type="search" placeholder="Filter ticker, company or director…"
            class="text-xs border border-slate-200 rounded px-2 py-1 w-56 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-indigo-400">
          <div class="flex flex-wrap gap-1.5" title="Click a type to show/hide those rows">${chips}</div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm min-w-[900px]">
          <thead><tr class="text-left text-[11px] uppercase tracking-wide text-slate-400 border-b border-slate-200">
            <th class="px-3 py-2 font-medium">Date</th><th class="px-3 py-2 font-medium">Company</th>
            <th class="px-3 py-2 font-medium">Director</th><th class="px-3 py-2 font-medium">Role</th>
            <th class="px-3 py-2 font-medium">Type</th>
            <th class="px-3 py-2 font-medium text-right">Shares</th><th class="px-3 py-2 font-medium text-right">Price</th>
            <th class="px-3 py-2 font-medium text-right">Value</th>
            <th class="px-3 py-2 font-medium">Signals</th>
            <th class="px-3 py-2 font-medium text-center" title="RNS announcement">RNS</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </section>`;
}

function wireTableControls() {
  function applyFilters() {
    const activeTypes = new Set();
    document.querySelectorAll(".tf-btn[aria-pressed='true']").forEach(b => activeTypes.add(b.dataset.tf));
    const q = (document.getElementById("sectorSearch")?.value || "").toLowerCase().trim();
    document.querySelectorAll("table tbody tr[data-type]").forEach(row => {
      const searchMatch = !q || (row.dataset.search || "").includes(q);
      const typeMatch = q ? true : activeTypes.has(row.dataset.type);
      row.style.display = (typeMatch && searchMatch) ? "" : "none";
    });
  }
  document.querySelectorAll(".tf-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      btn.setAttribute("aria-pressed", String(btn.getAttribute("aria-pressed") !== "true"));
      applyFilters();
    });
  });
  document.getElementById("sectorSearch")?.addEventListener("input", applyFilters);
  applyFilters();
  document.getElementById("periodSelect")?.addEventListener("change", e => {
    const d = e.target.value;
    const url = new URL(location.href);
    if (d) url.searchParams.set("days", d); else url.searchParams.delete("days");
    location.href = url.toString();
  });
}

function render(rows) {
  app.innerHTML = `
    <div class="pt-4 pb-2 flex items-center justify-between flex-wrap gap-2">
      <h1 class="text-2xl font-semibold tracking-tight">${esc(sector || "Unknown sector")}</h1>
      ${periodDropdown()}
    </div>`
    + summaryTiles(rows)
    + companiesTable(rows)
    + dealingsTable(rows);
  wireTableControls();
}

async function load() {
  if (!sector) {
    app.innerHTML = `<div class="py-20 text-center text-rose-600 text-sm">No sector specified. Use <code>?sector=Technology</code>.</div>`;
    return;
  }
  document.title = sector + " — Directors Dealings";
  const isOther = sector.toLowerCase() === "other";
  const sectorFilter = isOther ? "or=(sector.is.null,sector.eq.)" : `sector=eq.${encodeURIComponent(sector)}`;
  const startDate = daysParam ? new Date(Date.now() - parseInt(daysParam, 10) * 86400000).toISOString().slice(0, 10) : null;
  const dateFilter = startDate ? `&date=gte.${startDate}` : "";
  try {
    const rows = await fetchView("public_company_v", `${sectorFilter}${dateFilter}&order=date.desc,announced_at.desc&limit=20000`);
    if (!rows || !rows.length) {
      app.innerHTML = `<div class="pt-4"><h1 class="text-2xl font-semibold tracking-tight">${esc(sector)}</h1></div>
        <div class="py-20 text-center text-slate-400 text-sm">No dealings found for this sector${startDate ? " in the selected period" : ""}.</div>`;
      return;
    }
    render(rows);
  } catch (e) {
    app.innerHTML = `<div class="py-20 text-center text-rose-600 text-sm">Couldn't load data (${esc(e.message)}).</div>`;
  }
}
load();
</script>
</body>
</html>
